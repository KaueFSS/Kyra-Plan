# Builds, signs and publishes a Kyra Plan release whenever a version tag
# (v1.2.3) is pushed — normally by `npm run release -- 1.2.3 "notas"`.
# The release gets the Windows installer plus `latest.json`, which is what
# every installed copy polls to auto-update.
name: Publicar versão

on:
  push:
    tags: ["v*"]
  # Recompila uma versão que já existe com o código atual e troca os arquivos
  # dela na release (a tag e o número da versão não mudam).
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da release a recompilar (ex.: v1.3.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Notas da versão (mensagem da tag)
        id: notes
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git fetch --tags --force
          body="$(git tag -l --format='%(contents)' "${TAG}")"
          # Uma linha "[pre-release]" na mensagem da tag publica como pré-lançamento:
          # dá para baixar e testar, mas o auto-update (releases/latest) ignora.
          if printf '%s\n' "$body" | grep -q '^\[pre-release\]'; then pre=true; else pre=false; fi
          body="$(printf '%s\n' "$body" | grep -v '^\[pre-release\]' || true)"
          {
            echo "prerelease=$pre"
            echo "body<<__NOTES__"
            printf '%s\n' "$body"
            echo "__NOTES__"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Testes
        run: npm test

      - name: Testes do backend
        working-directory: src-tauri
        run: cargo test --lib

      - name: Compilar, assinar e publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Kyra Plan ${{ inputs.tag || github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ steps.notes.outputs.prerelease }}
          includeUpdaterJson: true
