<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    SentUtility app icon.
    A single continuous "S" (the path through your day) inside a progress
    ring whose tip is the glowing "now" marker used across the app.
    Source for `npx tauri icon`; keep it square, 1024x1024.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2e"/>
      <stop offset="0.55" stop-color="#0b1426"/>
      <stop offset="1" stop-color="#050912"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#2b8af7" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#2b8af7" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#2b8af7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ess" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#e6f3ff"/>
      <stop offset="0.45" stop-color="#8cc7ff"/>
      <stop offset="1" stop-color="#2b8af7"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#2b8af7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="40" y="40" width="944" height="944" rx="216" fill="url(#bg)"/>
  <rect x="40" y="40" width="944" height="944" rx="216" fill="url(#bloom)"/>
  <rect x="40" y="40" width="944" height="944" rx="216" fill="url(#sheen)"/>
  <rect x="41.5" y="41.5" width="941" height="941" rx="214.5" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3"/>

  <!-- Ring: track, progress, and the glowing "now" tip -->
  <circle cx="512" cy="512" r="345" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="34"/>
  <path d="M512 167 A345 345 0 1 1 187.8 394" fill="none" stroke="url(#arc)" stroke-width="34" stroke-linecap="round"/>
  <circle cx="187.8" cy="394" r="40" fill="#7dd3fc" opacity="0.7" filter="url(#glow)"/>
  <circle cx="187.8" cy="394" r="27" fill="#ffffff"/>

  <!-- The S: one stroke, two arcs -->
  <path d="M594.3 369.5 A95 95 0 1 0 512 512 A95 95 0 1 1 429.7 654.5"
        fill="none" stroke="#2b8af7" stroke-opacity="0.55" stroke-width="118" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M594.3 369.5 A95 95 0 1 0 512 512 A95 95 0 1 1 429.7 654.5"
        fill="none" stroke="url(#ess)" stroke-width="110" stroke-linecap="round"/>
</svg>
